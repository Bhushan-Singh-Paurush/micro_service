name: Deploy Authentication Service

on:
  push:
    branches:
      - main
    paths:
      - 'Authentication/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Authentication Image
        uses: docker/build-push-action@v6
        with:
          context: ./Authentication
          push: true
          tags: bhushansingh/authentication:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ec2-user/micro_service
            sudo docker compose pull authentication
            sudo docker compose up -d authentication