_format_version: "3.0"


plugins:
  - name: rate-limiting
    config:
      minute: 100
      policy: redis
      redis_host: redis
      redis_port: 6379

services:
  - name: attendance_service
    url: http://attendance:4001
    routes:
      - name: attendance_route
        paths:
          - /attendance

  - name: customer_service
    url: http://customer:4002
    routes:
      - name: customer_route
        paths:
          - /customer

  - name: auth_service
    url: http://authentication:4003
    routes:
      - name: auth_route
        paths:
          - /auth

  - name: notification_service
    url: http://notification:4004
    routes:
      - name: notification_route
        paths:
          - /notification